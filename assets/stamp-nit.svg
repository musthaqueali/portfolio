<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Text Path for circular stamp text -->
    <path id="circle-path-outer" d="M 80,80 m -62,0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0" />
    <path id="circle-path-inner" d="M 80,80 m -44,0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0" />
  </defs>

  <!-- Outer Double Dashed Ring -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#c03f13" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#c03f13" stroke-width="1"/>
  <circle cx="80" cy="80" r="48" fill="none" stroke="#c03f13" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Curved Text -->
  <text font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#c03f13" letter-spacing="2.5">
    <textPath href="#circle-path-outer" startOffset="50%" text-anchor="middle">
      ★ NIT CALICUT ★ CLASS OF 2026
    </textPath>
  </text>

  <!-- Center Crest & Star -->
  <polygon points="80,56 83,67 94,67 85,73 88,84 80,78 72,84 75,73 66,67 77,67" fill="#c03f13"/>
  <text x="80" y="98" font-family="'Big Shoulders Display', sans-serif" font-size="16" font-weight="900" fill="#c03f13" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  <text x="80" y="112" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#c03f13" text-anchor="middle" letter-spacing="1">DATA ANALYST</text>
</svg>
